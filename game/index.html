<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gobble Dash — A Turkey Escape Game</title>
<style>
  html, body { margin: 0; padding: 0; background: #2e1808; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #f7b267; image-rendering: auto; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Gobble Dash: a turkey escapes Thanksgiving dinner. Jump with Space, dash with Shift, hide in hay with Down."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
